services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api

    ports:
      - "80:80"
    networks:
      - test-network
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    expose:
      - "5001"
    env_file:
      - ./backend/.env
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - test-network

  mongo:
    image: mongo:latest
    networks:
      - test-network
    volumes:
      - test-volume:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    restart: unless-stopped

networks:
  test-network:
    driver: bridge


volumes:
  test-volume:
    driver: local
